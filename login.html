<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Ferretería Los Maestros</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <h1>Ferretería Los Maestros</h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="registro.html">Registrarse</a></li>
                <li><a href="login.html" class="activo">Iniciar sesión</a></li>
                <li><a href="carrito.html">🛒 Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Iniciar sesión</h2>
            <p>Ingresa con tu correo @duoc.cl y contraseña.</p>

            <div id="errorLogin" class="errores" style="display:none;"></div>

            <form id="formLogin">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@duoc.cl" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="btn btn-principal">Ingresar</button>
            </form>

            <p class="link-secundario">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </section>
    </main>

    <footer>
        <p>Ferretería Los Maestros</p>
        <p>Equipo: Deland Cabello y Josefa Sánchez</p>
        <p>DSY1104 – 2026</p>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
